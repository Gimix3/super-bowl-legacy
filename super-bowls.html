<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Bowls | Super Bowl Legacy</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #050b18;
    color: white;
}

header {
    background: linear-gradient(135deg, #07152f, #020611);
    padding: 35px 20px;
    text-align: center;
    border-bottom: 2px solid #c9a227;
}

header h1 {
    margin: 0;
    font-size: 42px;
    letter-spacing: 4px;
    color: #d4af37;
}

header p {
    margin-top: 10px;
    color: #bfc7d5;
    font-size: 16px;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 40px 20px;
}

.back {
    display: inline-block;
    margin-bottom: 30px;
    color: #d4af37;
    text-decoration: none;
    font-weight: bold;
}

.back:hover {
    text-decoration: underline;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 22px;
}

.card {
    background: linear-gradient(145deg, #0d1b36, #071022);
    border: 1px solid #243657;
    border-radius: 14px;
    padding: 25px;
    transition: transform 0.2s, border-color 0.2s;
}

.card:hover {
    transform: translateY(-5px);
    border-color: #d4af37;
}

.number {
    color: #d4af37;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 2px;
}

.card h2 {
    margin: 10px 0;
    font-size: 25px;
}

.card p {
    color: #aeb8c9;
    line-height: 1.5;
    margin: 6px 0;
}

.year {
    color: white !important;
    font-weight: bold;
}

footer {
    text-align: center;
    padding: 40px 20px;
    color: #6f7b91;
    border-top: 1px solid #1d2b45;
    margin-top: 40px;
}
</style>
</head>

<body>

<header>
    <h1>SUPER BOWLS</h1>
    <p>The complete history of the biggest game in American football</p>
</header>

<div class="container">

<a class="back" href="index.html">← BACK TO HOME</a>

</div>

</html>
